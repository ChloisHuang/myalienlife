<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Ocean caustics sampling probe</title>
<style>body{margin:16px;background:#202124;color:white;font:14px monospace}canvas{width:min(768px,100%);height:auto}pre{white-space:pre-wrap}</style>
<h1>Ocean caustics sampling probe</h1><pre id="result">Running</pre>
<script type="module">
import * as THREE from 'three';
import {createOceanCaustics,createOceanKit} from '/src/ocean.js';
const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setSize(384,384);document.body.append(renderer.domElement);
const caustics=createOceanCaustics(renderer);
createOceanKit(new THREE.Group(),new THREE.Texture(),caustics.texture);
caustics.update(1);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({
 uniforms:{map:{value:caustics.texture}},
 vertexShader:'varying vec2 uvPoint;void main(){uvPoint=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:'varying vec2 uvPoint;uniform sampler2D map;void main(){gl_FragColor=vec4(vec3(texture2D(map,uvPoint).r),1.);}'
})));
const target=new THREE.WebGLRenderTarget(384,384,{depthBuffer:false});
renderer.setRenderTarget(target);renderer.render(scene,camera);
const pixels=new Uint8Array(384*384*4);renderer.readRenderTargetPixels(target,0,0,384,384,pixels);
let total=0,max=0,lit=0;for(let i=0;i<pixels.length;i+=4){total+=pixels[i];max=Math.max(max,pixels[i]);if(pixels[i]>0)lit++;}
renderer.setRenderTarget(null);renderer.render(scene,camera);
document.querySelector('#result').textContent=JSON.stringify({minFilter:caustics.texture.minFilter,generateMipmaps:caustics.texture.generateMipmaps,sampledMean:total/(384*384),sampledMax:max,nonzeroPixels:lit},null,2);
</script></html>
