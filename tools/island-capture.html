<html lang="zh-CN"><head><meta charset="utf-8"><title>星岛截图</title><link rel="icon" href="data:,"><style>html,body,#world{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block}.ufo-flight-board{display:none}</style></head><body><div id="world"></div><script type="module">
